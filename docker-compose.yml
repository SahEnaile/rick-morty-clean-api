services:
  nginx:
    image: nginx:alpine
    container_name: rick-morty-nginx  
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:     
      - rick-morty-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rick-morty-app    
    volumes:
      - .:/var/www/html
    networks:
      - rick-morty-net                

networks:
  rick-morty-net:
    driver: bridge